name: Release

# Publishes multi-architecture images to GHCR and creates a GitHub Release.
# Triggered by pushing a semantic version tag, e.g.:
#   git tag v2.0.0 && git push origin v2.0.0

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v2.0.0)'
        required: true

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Backend tests
        working-directory: backend
        run: go test -count=1 ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build

  publish:
    name: Build and push images
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=XiaoWork Nav
            org.opencontainers.image.description=Lightweight self-hosted personal navigation start page
            org.opencontainers.image.licenses=MIT

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise published tags
        run: |
          {
            echo "### Published image"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          prerelease=""
          case "${TAG}" in *-*) prerelease="--prerelease" ;; esac

          notes_file="$(mktemp)"
          {
            echo "## Container image"
            echo ""
            echo '```'
            echo "docker pull ghcr.io/${{ github.repository }}:${TAG}"
            echo '```'
            echo ""
            echo "## Upgrade"
            echo ""
            echo '```bash'
            echo "./scripts/update.sh ${TAG}"
            echo '```'
            echo ""
            echo "Data (database, uploaded icons, backups) is preserved. A snapshot is"
            echo "taken automatically before the update; see docs/updating.md."
          } > "${notes_file}"

          gh release create "${TAG}" \
            --title "XiaoWork Nav ${TAG}" \
            --notes-file "${notes_file}" \
            --generate-notes \
            ${prerelease}
