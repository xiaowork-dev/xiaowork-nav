# XiaoWork Nav — Nginx Proxy Manager (shared Docker network) deployment.
#
# This variant publishes NO host port. The app joins an existing external
# Docker network shared with NPM; configure NPM to forward to
#   http://<XN_CONTAINER_NAME>:8080
#
# The network name is intentionally not hard-coded: set XN_PROXY_NETWORK in
# .env to the name of your existing NPM network.
#
# Usage:
#   cp .env.example .env   # set XN_PROXY_NETWORK and XN_CONTAINER_NAME
#   ../scripts/deploy.sh --compose compose.npm.yaml

name: xiaowork-nav

services:
  app:
    image: ${XN_IMAGE:-ghcr.io/xiaowork-dev/xiaowork-nav}:${APP_VERSION:-latest}
    container_name: ${XN_CONTAINER_NAME:-xiaowork-nav}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      XN_DATA_DIR: /data
      XN_HOST: 0.0.0.0
      XN_PORT: "8080"
      XN_LOG_LEVEL: ${XN_LOG_LEVEL:-info}
      XN_ALLOW_GUEST_ACCESS: ${XN_ALLOW_GUEST_ACCESS:-true}
      XN_SECURE_COOKIE: ${XN_SECURE_COOKIE:-true}
      XN_BACKUP_KEEP: ${XN_BACKUP_KEEP:-5}
      XN_UPDATE_REPO: ${XN_UPDATE_REPO:-}
      XN_TRUSTED_PROXIES: ${XN_TRUSTED_PROXIES:-}
      XN_ALLOWED_ORIGINS: ${XN_ALLOWED_ORIGINS:-}
      TZ: ${TZ:-UTC}
    volumes:
      - ${XN_DATA_HOST_DIR:-./data}:/data
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
    name: ${XN_PROXY_NETWORK:?set XN_PROXY_NETWORK in .env to your NPM network name}
