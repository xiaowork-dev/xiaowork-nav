<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#303a83" />
    <title>XiaoWork Nav</title>
    <script>
      // Paint the remembered theme before the stylesheet lands, so switching to
      // light or to the pond theme never flashes the default dark page first.
      // Keep the key and values in sync with src/composables/useTheme.ts; that
      // module re-applies the same choice once the bundle boots.
      try {
        var stored = localStorage.getItem('xn-theme')
        if (stored === 'light' || stored === 'dark' || stored === 'pond') {
          document.documentElement.dataset.theme = stored
        }
      } catch (error) {
        /* Private mode without storage: the default theme applies. */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
